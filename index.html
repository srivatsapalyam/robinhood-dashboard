<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robinhood | Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --rh-green: #00C805;
            --rh-green-dark: #003802;
            --rh-black: #000000;
            --rh-dark-grey: #0E1013;
            --rh-card-bg: #171A1F;
            --rh-border: #2A2E35;
            --rh-text: #FFFFFF;
            --rh-muted: #8A929E;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--rh-black);
            color: var(--rh-text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Authenticated Header Navbar with Search Integration */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 4%;
            background-color: var(--rh-black);
            border-bottom: 1px solid var(--rh-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--rh-green);
            text-decoration: none;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-wrapper {
            position: relative;
            width: 320px;
        }

        .search-bar-input {
            width: 100%;
            background-color: var(--rh-dark-grey);
            border: 1px solid var(--rh-border);
            color: var(--rh-text);
            padding: 10px 16px 10px 36px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.15s ease;
        }

        .search-bar-input:focus {
            border-color: var(--rh-green);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 11px;
            width: 14px;
            height: 14px;
            fill: var(--rh-muted);
            pointer-events: none;
        }

        .search-suggestions-box {
            position: absolute;
            top: 42px;
            left: 0;
            width: 100%;
            background-color: var(--rh-card-bg);
            border: 1px solid var(--rh-border);
            border-radius: 8px;
            max-height: 260px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 200;
        }

        .suggestion-item {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background-color: var(--rh-dark-grey);
        }

        .suggestion-item .tick {
            font-weight: 700;
            font-size: 13px;
        }

        .suggestion-item .desc {
            font-size: 12px;
            color: var(--rh-muted);
        }

        .nav-links {
            display: flex;
            gap: 32px;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-links div {
            color: var(--rh-muted);
            cursor: pointer;
            transition: color 0.15s ease;
            padding: 5px 0;
            position: relative;
        }

        .nav-links div:hover, .nav-links div.active {
            color: var(--rh-text);
        }

        .nav-links div.active::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--rh-green);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background-color: var(--rh-card-bg);
            border: 1px solid var(--rh-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--rh-green);
        }

        /* Portfolio Operational Sub-Navigation Bar */
        .portfolio-sub-nav {
            display: flex;
            gap: 36px;
            padding: 12px 4%;
            background-color: var(--rh-black);
            border-bottom: 1px solid var(--rh-border);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .sub-nav-item {
            color: var(--rh-muted);
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .sub-nav-item:hover, .sub-nav-item.active {
            color: var(--rh-text);
        }

        /* Real-Time Live Market Indices Ticker Ribbon */
        .indices-ribbon {
            display: flex;
            gap: 32px;
            padding: 10px 4%;
            background-color: #050607;
            border-bottom: 1px solid var(--rh-border);
            overflow-x: auto;
            white-space: nowrap;
        }

        .indices-ribbon::-webkit-scrollbar {
            display: none;
        }

        .index-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }

        .index-name {
            color: var(--rh-muted);
            font-weight: 600;
        }

        .index-val {
            color: var(--rh-text);
            font-weight: 500;
        }

        .index-chg {
            color: var(--rh-green);
            font-weight: 600;
        }

        /* Application Main Workspace Grid Layout */
        .app-workspace {
            max-width: 1140px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 40px;
        }

        @media (max-width: 900px) {
            .app-workspace {
                grid-template-columns: 1fr;
            }
        }

        /* Main Chart Area Metrics */
        .portfolio-metric h2 {
            font-size: 14px;
            font-weight: 500;
            color: var(--rh-muted);
            margin: 0 0 4px 0;
        }

        .portfolio-metric h1 {
            font-size: 40px;
            font-weight: 500;
            margin: 0 0 4px 0;
            letter-spacing: -1px;
        }

        .portfolio-metric .delta {
            color: var(--rh-green);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 25px;
        }

        .chart-container {
            width: 100%;
            height: 200px;
            margin-bottom: 40px;
        }

        /* Dynamic Product View Content Injection Panel */
        .view-content-pane {
            border-top: 1px solid var(--rh-border);
            padding-top: 30px;
        }

        .view-content-pane h3 {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 20px 0;
        }

        /* Asset Items Row Layout styles */
        .asset-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .asset-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: var(--rh-dark-grey);
            border: 1px solid var(--rh-border);
            border-radius: 12px;
            transition: border-color 0.15s ease;
        }

        .asset-row:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .asset-info {
            display: flex;
            flex-direction: column;
        }

        .asset-info .ticker {
            font-weight: 600;
            font-size: 15px;
        }

        .asset-info .name {
            font-size: 13px;
            color: var(--rh-muted);
        }

        .asset-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .asset-price {
            text-align: right;
            font-size: 15px;
            font-weight: 500;
        }

        .asset-change {
            font-size: 12px;
            color: var(--rh-green);
        }

        .btn-invest {
            background-color: var(--rh-green-dark);
            color: var(--rh-green);
            border: none;
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .btn-invest:hover {
            opacity: 0.85;
        }

        /* Right Sidebar Panel Widget Columns */
        .right-sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-card {
            background-color: var(--rh-dark-grey);
            border: 1px solid var(--rh-border);
            border-radius: 16px;
