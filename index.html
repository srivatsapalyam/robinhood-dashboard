<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robinhood | Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?' +
        'family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --rh-green: #00C805;
            --rh-green-dark: #003802;
            --rh-black: #000000;
            --rh-dark-grey: #0E1013;
            --rh-card-bg: #171A1F;
            --rh-border: #2A2E35;
            --rh-text: #FFFFFF;
            --rh-muted: #8A929E;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--rh-black);
            color: var(--rh-text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Top Header Navigation Panel */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 4%;
            background-color: var(--rh-black);
            border-bottom: 1px solid var(--rh-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--rh-green);
            text-decoration: none;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-wrapper {
            position: relative;
            width: 320px;
        }

        .search-bar-input {
            width: 100%;
            background-color: var(--rh-dark-grey);
            border: 1px solid var(--rh-border);
            color: var(--rh-text);
            padding: 10px 16px 10px 36px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
        }

        .search-bar-input:focus {
            border-color: var(--rh-green);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 11px;
            width: 14px;
            height: 14px;
            fill: var(--rh-muted);
            pointer-events: none;
        }

        .search-suggestions-box {
            position: absolute;
            top: 42px;
            left: 0;
            width: 100%;
            background-color: var(--rh-card-bg);
            border: 1px solid var(--rh-border);
            border-radius: 8px;
            max-height: 260px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 200;
        }

        .suggestion-item {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .suggestion-item:hover {
            background-color: var(--rh-dark-grey);
        }

        .suggestion-item .tick { font-weight: 700; font-size: 13px; }
        .suggestion-item .desc { font-size: 12px; color: var(--rh-muted); }

        .nav-links {
            display: flex;
            gap: 32px;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-links div {
            color: var(--rh-muted);
            cursor: pointer;
            transition: color 0.15s ease;
            padding: 5px 0;
            position: relative;
        }

        .nav-links div:hover, .nav-links div.active {
            color: var(--rh-text);
        }

        .nav-links div.active::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--rh-green);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background-color: var(--rh-card-bg);
            border: 1px solid var(--rh-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--rh-green);
        }

        /* Portfolio Explore Secondary Navbar submenus */
        .portfolio-sub-nav {
            display: flex;
            gap: 36px;
            padding: 12px 4%;
            background-color: var(--rh-black);
            border-bottom: 1px solid var(--rh-border);
            font-size: 14px;
            font-weight: 500;
        }

        .sub-nav-item {
            color: var(--rh-muted);
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .sub-nav-item:hover, .sub-nav-item.active {
            color: var(--rh-text);
        }

        /* Market Indices Ribbon */
        .indices-ribbon {
            display: flex;
            gap: 32px;
            padding: 10px 4%;
            background-color: #050607;
            border-bottom: 1px solid var(--rh-border);
            overflow-x: auto;
            white-space: nowrap;
        }

        .indices-ribbon::-webkit-scrollbar { display: none; }
        .index-item { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; }
        .index-name { color: var(--rh-muted); font-weight: 600; }
        .index-val { color: var(--rh-text); font-weight: 500; }
        .index-chg { color: var(--rh-green); font-weight: 600; }

        /* Workspace Core Layout Grid Matrix */
        .app-workspace {
            max-width: 1140px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 40px;
        }

        @media (max-width: 900px) {
            .app-workspace { grid-template-columns: 1fr; }
        }

        .portfolio-metric h2 { font-size: 14px; font-weight: 500; color: var(--rh-muted); margin: 0 0 4px 0; }
        .portfolio-metric h1 { font-size: 40px; font-weight: 500; margin: 0 0 4px 0; letter-spacing: -1px; }
        .portfolio-metric .delta { color: var(--rh-green); font-size: 14px; font-weight: 500; margin-bottom: 25px; }

        .chart-container { width: 100%; height: 200px; margin-bottom: 40px; }

        .view-content-pane { border-top: 1px solid var(--rh-border); padding-top: 30px; }
        .view-content-pane h3 { font-size: 18px; font-weight: 600; margin: 0 0 20px 0; }

        .asset-list { display: flex; flex-direction: column; gap: 12px; }
        .asset-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: var(--rh-dark-grey);
            border: 1px solid var(--rh-border);
            border-radius: 12px;
            transition: border-color 0.15s ease;
        }
        .asset-row:hover { border-color: rgba(255, 255, 255, 0.15); }
        .asset-info { display: flex; flex-direction: column; }
        .asset-info .ticker { font-weight: 600; font-size: 15px; }
        .asset-info .name { font-size: 13px; color: var(--rh-muted); }
        .asset-actions { display: flex; align-items: center; gap: 20px; }
        .asset-price { text-align: right; font-size: 15px; font-weight: 500; }
        .asset-change { font-size: 12px; color: var(--rh-green); }

        .btn-invest {
            background-color: var(--rh-green-dark);
            color: var(--rh-green);
            border: none;
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Sidebar Containers Widgets panels */
        .right-sidebar { display: flex; flex-direction: column; gap: 20px; }
        .sidebar-card { background-color: var(--rh-dark-grey); border: 1px solid var(--rh-border); border-radius: 16px; padding: 24px; }
        .sidebar-card h4 { margin: 0 0 16px 0; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--rh-muted); }

        .order-form { display: flex; flex-direction: column; gap: 15px; }
        .form-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .form-row input { background: var(--rh-black); border: 1px solid var(--rh-border); color: var(--rh-text); padding: 8px 12px; border-radius: 8px; width: 80px; text-align: right; }

        .btn-execute {
            background-color: var(--rh-green);
            color: var(--rh-black);
            border: none;
            padding: 12px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .progress-track { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; margin-top: 10px; }
        .progress-bar { height: 100%; width: 68%; background: var(--rh-green); }

        /* Floating Cortex Bot Drawers */
        .ai-fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: var(--rh-green);
            color: var(--rh-black);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0,200,5,0.3);
            cursor: pointer;
            z-index: 1000;
            font-size: 24px;
        }

        .chat-drawer {
            position: fixed;
            bottom: 95px;
            right: 25px;
            width: 340px;
            height: 420px;
            background-color: var(--rh-card-bg);
            border: 1px solid var(--rh-border);
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        .chat-header { background-color: var(--rh-dark-grey); padding: 16px; border-bottom: 1px solid var(--rh-border); font-weight: 600; display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .chat-header span { width: 8px; height: 8px; background-color: var(--rh-green); border-radius: 50%; }
        .chat-history { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; font-size: 13px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; }
        .msg.bot { background-color: var(--rh-dark-grey); color: var(--rh-text); align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg.user { background-color: var(--rh-green); color: var(--rh-black); align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 500; }
        .chat-input-bar { padding: 12px; border-top: 1px solid var(--rh-border); background-color: var(--rh-dark-grey); display: flex; gap: 8px; }
        .chat-input-bar input { flex: 1; background: var(--rh-black); border: 1px solid var(--rh-border); color: var(--rh-text); padding: 8px 12px; border-radius: 20px; font-size: 13px; outline: none; }
        .chat-input-bar button { background: transparent; border: none; color: var(--rh-green); font-weight: 600; cursor: pointer; padding: 0 8px; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo" onclick="resetToTotalPortfolio(); return false;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 19H7L12 9L17 19H22L12 2Z" fill="#00C805"/>
            </svg>
            Robinhood
        </a>

        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" id="assetSearchBar" class="search-bar-input" 
                   placeholder="Search stocks or crypto (e.g. AAPL, BTC)" 
                   oninput="handleSearchSuggestions()" 
                   onblur="hideSearchSuggestionsDeferred()">
            <div class="search-suggestions-box" id="searchSuggestionsBox"></div>
        </div>
